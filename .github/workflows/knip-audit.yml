name: Knip audit

on:
  push:
    branches:
      - chore/dead-code-audit

permissions:
  contents: read

jobs:
  knip:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Knip audit
        shell: bash
        run: |
          set +e
          pnpm knip
          status=$?
          echo "KNIP_EXIT_CODE=$status"
          exit 0
