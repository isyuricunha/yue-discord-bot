name: Knip cleanup validation

on:
  push:
    branches:
      - chore/dead-code-audit

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply conservative cleanup
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          import re

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f'{path}: expected one occurrence of {old!r}, found {count}')
              file.write_text(text.replace(old, new, 1))

          def sub_once(path: str, pattern: str, replacement: str) -> None:
              file = Path(path)
              text = file.read_text()
              updated, count = re.subn(pattern, replacement, text, count=1, flags=re.MULTILINE)
              if count != 1:
                  raise RuntimeError(f'{path}: expected one regex match, found {count}: {pattern}')
              file.write_text(updated)

          # Internal helpers/types that are used, but never consumed outside their own module.
          replace_once('apps/api/src/routes/panel_ai_owner.routes.ts', 'export function mistral_panel_agent_is_configured', 'function mistral_panel_agent_is_configured')
          replace_once('apps/api/src/services/panel_ai_stream.ts', 'export function extract_mistral_stream_delta', 'function extract_mistral_stream_delta')
          replace_once('apps/api/src/services/panel_ai.ts', 'export type mistral_agent_input', 'type mistral_agent_input')
          replace_once('apps/api/src/services/panel_ai.ts', 'export type panel_ai_event_logger', 'type panel_ai_event_logger')
          replace_once('apps/api/src/services/panel_ai.ts', 'export function build_mistral_agent_inputs', 'function build_mistral_agent_inputs')
          replace_once('apps/api/src/services/panel_ai.ts', 'export async function complete_with_mistral_agent', 'async function complete_with_mistral_agent')
          replace_once('apps/api/src/services/panel_ai.ts', 'export async function complete_with_custom_provider', 'async function complete_with_custom_provider')
          replace_once('apps/api/src/services/panel_module_context.ts', 'export const SUPPORTED_PANEL_MODULE_PAGE_KEYS', 'const SUPPORTED_PANEL_MODULE_PAGE_KEYS')
          replace_once('apps/api/src/services/panel_module_context.ts', 'export type supported_panel_module_page_key', 'type supported_panel_module_page_key')
          replace_once('apps/api/src/services/panel_context.ts', 'export type panel_context_guild', 'type panel_context_guild')
          replace_once('apps/api/src/services/panel_context.ts', 'export type panel_context_anti_raid', 'type panel_context_anti_raid')
          replace_once('apps/bot/src/services/llm_client.ts', 'export type TimeoutHandle', 'type TimeoutHandle')
          replace_once('apps/bot/src/services/llm_client.ts', 'export function create_mistral_timeout', 'function create_mistral_timeout')
          replace_once('apps/bot/src/services/support/support.service.ts', 'export class SupportService', 'class SupportService')
          replace_once('apps/bot/src/services/ai_fallback_settings.service.ts', 'export type AiFallbackSettingsRow', 'type AiFallbackSettingsRow')
          replace_once('apps/web/src/hooks/usePanelAssistant.ts', 'export type chat_send_result', 'type chat_send_result')

          # Confirmed dead code / dead aliases.
          sub_once(
              'apps/api/src/services/panel_ai.ts',
              r'\nexport function is_eligible_mistral_fallback_error\(error: unknown\): boolean \{\n  return classify_mistral_failure\(error\)\.eligible\n\}\n',
              '\n',
          )
          sub_once(
              'apps/bot/src/services/llm_client_singleton.ts',
              r'\nexport function init_llm_client\(\): void \{\n\tif \(cached !== undefined\) return;\n\tget_llm_client\(\);\n\}\n',
              '\n',
          )
          replace_once(
              'apps/bot/src/services/support/support.service.ts',
              '\nexport const supportCustomIdPrefix = SUPPORT_CUSTOM_ID_PREFIX',
              '',
          )
          replace_once(
              'apps/bot/src/services/yue_persona.ts',
              '\tbuild_text_only_contract,\n',
              '',
          )
          PY

      - name: Diff sanity check
        run: |
          git diff --check
          git diff --stat

      - name: Knip
        run: pnpm knip

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm type-check

      - name: Tests
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Commit validated cleanup
        shell: bash
        run: |
          rm .github/workflows/knip-audit.yml
          git add -A
          git config user.name "Yuri"
          git config user.email "isyuricunha@duck.com"
          git commit -m "chore: remove dead code and unused exports"
          git push origin HEAD:chore/dead-code-audit
