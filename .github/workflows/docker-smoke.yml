name: Docker smoke

on:
  pull_request:
    branches: ["main"]
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "apps/*/package.json"
      - "packages/*/package.json"
      - "packages/database/prisma/**"
      - "packages/database/prisma.config.ts"
      - ".github/workflows/ci.yml"
      - ".github/workflows/docker-smoke.yml"

permissions:
  contents: read

concurrency:
  group: docker-smoke-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    name: docker/smoke-${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out the repo
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build platform image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          outputs: type=cacheonly
          cache-from: |
            type=gha,scope=yue-${{ matrix.arch }}
            type=gha,scope=yue-pr-${{ matrix.arch }}
          cache-to: type=gha,scope=yue-pr-${{ matrix.arch }},mode=max
