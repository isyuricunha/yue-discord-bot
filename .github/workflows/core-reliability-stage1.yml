name: Core reliability stage 1

on:
  push:
    branches: [fix/core-runtime-reliability]

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply reliability changes
        run: |
          python <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'missing pattern in {path}: {old[:120]!r}')
              p.write_text(text.replace(old, new, 1))

          # Prisma schema: explicit state for retryable scheduled work + access-path indexes.
          schema = Path('packages/database/prisma/schema.prisma')
          text = schema.read_text()
          text = text.replace(
              '  metadata    Json?\n  createdAt   DateTime    @default(now())\n',
              '  metadata      Json?\n  createdAt     DateTime    @default(now())\n  warnExpiredAt DateTime?\n',
              1,
          )
          text = text.replace(
              '  @@index([guildId, createdAt])\n  @@index([userId])\n  @@map("mod_logs")',
              '  @@index([guildId, createdAt])\n  @@index([userId])\n  @@index([guildId, action, warnExpiredAt, createdAt], map: "mod_logs_warn_expiration_idx")\n  @@map("mod_logs")',
              1,
          )
          text = text.replace(
              '  reminder24hAt   DateTime?\n  reminder1hAt    DateTime?\n  reminder10mAt   DateTime?\n',
              '  reminder24hAt        DateTime?\n  reminder1hAt         DateTime?\n  reminder10mAt        DateTime?\n  reminder24hClaimedAt DateTime?\n  reminder1hClaimedAt  DateTime?\n  reminder10mClaimedAt DateTime?\n',
              1,
          )
          text = text.replace(
              '  @@index([guildId, startsAt])\n  @@index([guildId, ended, cancelled, startsAt])\n  @@map("scheduled_events")',
              '  @@index([guildId, startsAt])\n  @@index([guildId, ended, cancelled, startsAt])\n  @@index([ended, cancelled, startsAt], map: "scheduled_events_due_end_idx")\n  @@index([ended, cancelled, reminder24hSent, reminder24hAt], map: "scheduled_events_24h_due_idx")\n  @@index([ended, cancelled, reminder1hSent, reminder1hAt], map: "scheduled_events_1h_due_idx")\n  @@index([ended, cancelled, reminder10mSent, reminder10mAt], map: "scheduled_events_10m_due_idx")\n  @@map("scheduled_events")',
              1,
          )
          text = text.replace(
              '  @@unique([guildId, userId])\n  @@index([guildId, executeAt])\n  @@map("guild_autorole_pendings")',
              '  @@unique([guildId, userId])\n  @@index([guildId, executeAt])\n  @@index([waitForFirstMessage, executeAt, updatedAt], map: "autorole_pending_due_idx")\n  @@map("guild_autorole_pendings")',
              1,
          )
          text = text.replace(
              '  ended     Boolean    @default(false)\n  createdBy String\n  createdAt DateTime   @default(now())\n  updatedAt DateTime   @updatedAt\n',
              '  ended                      Boolean   @default(false)\n  createdBy                  String\n  createdAt                  DateTime  @default(now())\n  updatedAt                  DateTime  @updatedAt\n  expirationClaimedAt        DateTime?\n  expirationNotifiedAt       DateTime?\n  expirationMessageUpdatedAt DateTime?\n',
              1,
          )
          text = text.replace(
              '  @@index([guildId, ended])\n  @@index([endsAt])\n  @@map("polls")',
              '  @@index([guildId, ended])\n  @@index([ended, endsAt], map: "polls_due_expiration_idx")\n  @@map("polls")',
              1,
          )
          text = text.replace(
              '  expiredHandledAt DateTime?\n',
              '  expiredHandledAt  DateTime?\n  expirationClaimedAt DateTime?\n',
              1,
          )
          text = text.replace(
              '  @@index([userId, createdAt])\n  @@index([userId, guildId, kind, expiresAt])\n  @@map("inventory_items")',
              '  @@index([userId, createdAt])\n  @@index([userId, guildId, kind, expiresAt])\n  @@index([expiredHandledAt, expiresAt], map: "inventory_items_due_expiration_idx")\n  @@map("inventory_items")',
              1,
          )
          text = text.replace(
              '  @@index([giveawayId])\n  @@map("giveaway_winners")',
              '  @@unique([giveawayId, userId], map: "giveaway_winners_giveaway_user_key")\n  @@index([giveawayId])\n  @@map("giveaway_winners")',
              1,
          )
          schema.write_text(text)

          migration = Path('packages/database/prisma/migrations/20260825050000_harden_scheduled_jobs/migration.sql')
          migration.parent.mkdir(parents=True, exist_ok=True)
          migration.write_text('''-- Make scheduled/background work retryable and index its real access paths.\n\nALTER TABLE "mod_logs" ADD COLUMN "warnExpiredAt" TIMESTAMP(3);\nUPDATE "mod_logs"\nSET "warnExpiredAt" = CURRENT_TIMESTAMP\nWHERE "action" = 'warn' AND "metadata"->>'warnExpired' = 'true';\nCREATE INDEX "mod_logs_warn_expiration_idx" ON "mod_logs"("guildId", "action", "warnExpiredAt", "createdAt");\n\nALTER TABLE "scheduled_events"\n  ADD COLUMN "reminder24hClaimedAt" TIMESTAMP(3),\n  ADD COLUMN "reminder1hClaimedAt" TIMESTAMP(3),\n  ADD COLUMN "reminder10mClaimedAt" TIMESTAMP(3);\nCREATE INDEX "scheduled_events_due_end_idx" ON "scheduled_events"("ended", "cancelled", "startsAt");\nCREATE INDEX "scheduled_events_24h_due_idx" ON "scheduled_events"("ended", "cancelled", "reminder24hSent", "reminder24hAt");\nCREATE INDEX "scheduled_events_1h_due_idx" ON "scheduled_events"("ended", "cancelled", "reminder1hSent", "reminder1hAt");\nCREATE INDEX "scheduled_events_10m_due_idx" ON "scheduled_events"("ended", "cancelled", "reminder10mSent", "reminder10mAt");\n\nALTER TABLE "polls"\n  ADD COLUMN "expirationClaimedAt" TIMESTAMP(3),\n  ADD COLUMN "expirationNotifiedAt" TIMESTAMP(3),\n  ADD COLUMN "expirationMessageUpdatedAt" TIMESTAMP(3);\nUPDATE "polls"\nSET "expirationNotifiedAt" = "updatedAt",\n    "expirationMessageUpdatedAt" = "updatedAt"\nWHERE "ended" = true;\nDROP INDEX IF EXISTS "polls_endsAt_idx";\nCREATE INDEX "polls_due_expiration_idx" ON "polls"("ended", "endsAt");\n\nALTER TABLE "inventory_items" ADD COLUMN "expirationClaimedAt" TIMESTAMP(3);\nCREATE INDEX "inventory_items_due_expiration_idx" ON "inventory_items"("expiredHandledAt", "expiresAt");\n\nCREATE INDEX "autorole_pending_due_idx" ON "guild_autorole_pendings"("waitForFirstMessage", "executeAt", "updatedAt");\n\nCREATE UNIQUE INDEX "giveaway_winners_giveaway_user_key" ON "giveaway_winners"("giveawayId", "userId");\n''')

          Path('apps/bot/src/services/warnExpirationService.ts').write_text(r'''import type { Client } from 'discord.js'
import { prisma } from '@yuebot/database'
import { logger } from '../utils/logger'
import { moderationLogService } from './moderationLog.service'
import { safe_error_details } from '../utils/safe_error'
import { with_serializable_retry } from '../utils/prisma-transaction'

type pending_warn = {
  id: string
  userId: string
  metadata: unknown
}

function was_expired_by_legacy_metadata(metadata: unknown): boolean {
  if (!metadata || typeof metadata !== 'object') return false
  return (metadata as Record<string, unknown>).warnExpired === true
}

export class WarnExpirationService {
  private intervalId: NodeJS.Timeout | null = null
  private running = false

  constructor(private client: Client) {}

  start() {
    if (this.intervalId) return

    this.intervalId = setInterval(() => {
      void this.run_once()
    }, 60 * 60 * 1000)

    void this.run_once()
    logger.info('⏰ Serviço de expiração de warns iniciado')
  }

  stop() {
    if (!this.intervalId) return
    clearInterval(this.intervalId)
    this.intervalId = null
    logger.info('⏰ Serviço de expiração de warns parado')
  }

  private async run_once() {
    if (this.running) return
    this.running = true
    try {
      await this.checkExpiredWarns()
    } finally {
      this.running = false
    }
  }

  private async checkExpiredWarns() {
    try {
      const configs = await prisma.guildConfig.findMany({
        where: { warnExpiration: { gt: 0 } },
        select: { guildId: true, warnExpiration: true },
      })

      for (const config of configs) {
        await this.expireWarnsForGuild(config.guildId, config.warnExpiration)
      }
    } catch (error) {
      logger.error({ err: safe_error_details(error) }, 'Erro ao verificar warns expirados')
    }
  }

  private async expireWarnsForGuild(guildId: string, expirationDays: number) {
    try {
      const guild = this.client.guilds.cache.get(guildId) ?? await this.client.guilds.fetch(guildId).catch(() => null)
      if (!guild) return

      const cutoffDate = new Date()
      cutoffDate.setDate(cutoffDate.getDate() - expirationDays)

      const oldWarns = await prisma.modLog.findMany({
        where: {
          guildId,
          action: 'warn',
          warnExpiredAt: null,
          createdAt: { lt: cutoffDate },
        },
        select: { id: true, userId: true, metadata: true },
      }) as pending_warn[]

      const legacy_expired_ids = oldWarns
        .filter((warn) => was_expired_by_legacy_metadata(warn.metadata))
        .map((warn) => warn.id)

      if (legacy_expired_ids.length > 0) {
        await prisma.modLog.updateMany({
          where: { id: { in: legacy_expired_ids }, warnExpiredAt: null },
          data: { warnExpiredAt: new Date() },
        })
      }

      const pendingWarns = oldWarns.filter((warn) => !was_expired_by_legacy_metadata(warn.metadata))
      if (pendingWarns.length === 0) return

      const warnsByUser = new Map<string, string[]>()
      for (const warn of pendingWarns) {
        const ids = warnsByUser.get(warn.userId) ?? []
        ids.push(warn.id)
        warnsByUser.set(warn.userId, ids)
      }

      for (const [userId, warnIds] of warnsByUser.entries()) {
        const result = await with_serializable_retry(async (tx) => {
          const now = new Date()
          const claimed = await tx.modLog.updateMany({
            where: { id: { in: warnIds }, warnExpiredAt: null },
            data: { warnExpiredAt: now },
          })

          if (claimed.count === 0) return null

          const member = await tx.guildMember.findUnique({
            where: { userId_guildId: { userId, guildId } },
            select: { warnings: true },
          })
          if (!member) {
            throw new Error(`guild member missing while expiring warns: ${guildId}/${userId}`)
          }

          const newWarnings = Math.max(0, member.warnings - claimed.count)
          await tx.guildMember.update({
            where: { userId_guildId: { userId, guildId } },
            data: { warnings: newWarnings },
          })

          await tx.modLog.create({
            data: {
              guildId,
              userId,
              moderatorId: this.client.user!.id,
              action: 'warn_expired',
              reason: `${claimed.count} warn(s) expirado(s) automaticamente após ${expirationDays} dias`,
            },
          })

          return { expiredCount: claimed.count, before: member.warnings, after: newWarnings }
        })

        if (!result) continue

        logger.info(
          `Expirados ${result.expiredCount} warn(s) de usuário ${userId} em guild ${guildId} (${result.before} -> ${result.after})`
        )

        const user = await this.client.users.fetch(userId).catch(() => null)
        if (user) {
          await moderationLogService.notify({
            guild,
            user,
            staff: this.client.user!,
            punishment: 'warn_expired',
            reason: `${result.expiredCount} warn(s) expirado(s) automaticamente após ${expirationDays} dias`,
            duration: '',
          }).catch((error) => {
            logger.warn({ err: safe_error_details(error), guildId, userId }, 'Falha ao notificar expiração de warn')
          })
        }
      }

      logger.info(`Guild ${guildId}: ${warnsByUser.size} usuário(s) com warns expirados`)
    } catch (error) {
      logger.error({ err: safe_error_details(error) }, `Erro ao expirar warns da guild ${guildId}`)
    }
  }
}
''')

          Path('apps/bot/src/services/scheduledEventScheduler.ts').write_text(r'''import { Client, EmbedBuilder } from 'discord.js'
import { prisma } from '@yuebot/database'
import { COLORS, EMOJIS } from '@yuebot/shared'

import { logger } from '../utils/logger'
import { getSendableChannel } from '../utils/discord'
import { safe_error_details } from '../utils/safe_error'

const CLAIM_LEASE_MS = 5 * 60 * 1000

type scheduled_event_row = {
  id: string
  guildId: string
  channelId: string
  title: string
  description: string | null
  startsAt: Date
}

function to_unix_seconds(date: Date) {
  return Math.floor(date.getTime() / 1000)
}

export class ScheduledEventScheduler {
  private interval: NodeJS.Timeout | null = null
  private running = false

  constructor(private client: Client) {}

  start() {
    if (this.interval) return
    this.interval = setInterval(() => void this.tick(), 30 * 1000)
    void this.tick()
    logger.info('📅 Scheduler de eventos agendados iniciado')
  }

  stop() {
    if (!this.interval) return
    clearInterval(this.interval)
    this.interval = null
    logger.info('📅 Scheduler de eventos agendados parado')
  }

  private async tick() {
    if (this.running) return
    this.running = true
    try {
      const now = new Date()
      await this.process_24h(now)
      await this.process_1h(now)
      await this.process_10m(now)
      await this.mark_due_as_ended(now)
    } catch (error) {
      logger.error({ err: safe_error_details(error) }, 'Erro ao processar scheduler de eventos agendados')
    } finally {
      this.running = false
    }
  }

  private async process_24h(now: Date) {
    const stale_claim = new Date(now.getTime() - CLAIM_LEASE_MS)
    const due = await prisma.scheduledEvent.findMany({
      where: {
        ended: false,
        cancelled: false,
        reminder24hSent: false,
        startsAt: { gt: now },
        reminder24hAt: { lte: now },
        OR: [{ reminder24hClaimedAt: null }, { reminder24hClaimedAt: { lt: stale_claim } }],
      },
      orderBy: [{ reminder24hAt: 'asc' }],
      take: 50,
      select: { id: true, guildId: true, channelId: true, title: true, description: true, startsAt: true },
    })

    for (const event of due) {
      const claimed = await prisma.scheduledEvent.updateMany({
        where: {
          id: event.id,
          reminder24hSent: false,
          OR: [{ reminder24hClaimedAt: null }, { reminder24hClaimedAt: { lt: stale_claim } }],
        },
        data: { reminder24hClaimedAt: now },
      })
      if (claimed.count === 0) continue

      try {
        await this.send_reminder_message(event, '⏰ Faltam 24 horas')
        await prisma.scheduledEvent.updateMany({
          where: { id: event.id, reminder24hSent: false },
          data: { reminder24hSent: true, reminder24hClaimedAt: null },
        })
      } catch (error) {
        await prisma.scheduledEvent.updateMany({ where: { id: event.id }, data: { reminder24hClaimedAt: null } }).catch(() => undefined)
        logger.error({ err: safe_error_details(error), scheduledEventId: event.id }, 'Falha ao enviar reminder de 24h')
      }
    }
  }

  private async process_1h(now: Date) {
    const stale_claim = new Date(now.getTime() - CLAIM_LEASE_MS)
    const due = await prisma.scheduledEvent.findMany({
      where: {
        ended: false,
        cancelled: false,
        reminder1hSent: false,
        startsAt: { gt: now },
        reminder1hAt: { lte: now },
        OR: [{ reminder1hClaimedAt: null }, { reminder1hClaimedAt: { lt: stale_claim } }],
      },
      orderBy: [{ reminder1hAt: 'asc' }],
      take: 50,
      select: { id: true, guildId: true, channelId: true, title: true, description: true, startsAt: true },
    })

    for (const event of due) {
      const claimed = await prisma.scheduledEvent.updateMany({
        where: {
          id: event.id,
          reminder1hSent: false,
          OR: [{ reminder1hClaimedAt: null }, { reminder1hClaimedAt: { lt: stale_claim } }],
        },
        data: { reminder1hClaimedAt: now },
      })
      if (claimed.count === 0) continue

      try {
        await this.send_reminder_message(event, '⏰ Faltam 1 hora')
        await prisma.scheduledEvent.updateMany({
          where: { id: event.id, reminder1hSent: false },
          data: { reminder1hSent: true, reminder1hClaimedAt: null },
        })
      } catch (error) {
        await prisma.scheduledEvent.updateMany({ where: { id: event.id }, data: { reminder1hClaimedAt: null } }).catch(() => undefined)
        logger.error({ err: safe_error_details(error), scheduledEventId: event.id }, 'Falha ao enviar reminder de 1h')
      }
    }
  }

  private async process_10m(now: Date) {
    const stale_claim = new Date(now.getTime() - CLAIM_LEASE_MS)
    const due = await prisma.scheduledEvent.findMany({
      where: {
        ended: false,
        cancelled: false,
        reminder10mSent: false,
        startsAt: { gt: now },
        reminder10mAt: { lte: now },
        OR: [{ reminder10mClaimedAt: null }, { reminder10mClaimedAt: { lt: stale_claim } }],
      },
      orderBy: [{ reminder10mAt: 'asc' }],
      take: 50,
      select: { id: true, guildId: true, channelId: true, title: true, description: true, startsAt: true },
    })

    for (const event of due) {
      const claimed = await prisma.scheduledEvent.updateMany({
        where: {
          id: event.id,
          reminder10mSent: false,
          OR: [{ reminder10mClaimedAt: null }, { reminder10mClaimedAt: { lt: stale_claim } }],
        },
        data: { reminder10mClaimedAt: now },
      })
      if (claimed.count === 0) continue

      try {
        await this.send_reminder_message(event, '⏰ Faltam 10 minutos')
        await prisma.scheduledEvent.updateMany({
          where: { id: event.id, reminder10mSent: false },
          data: { reminder10mSent: true, reminder10mClaimedAt: null },
        })
      } catch (error) {
        await prisma.scheduledEvent.updateMany({ where: { id: event.id }, data: { reminder10mClaimedAt: null } }).catch(() => undefined)
        logger.error({ err: safe_error_details(error), scheduledEventId: event.id }, 'Falha ao enviar reminder de 10m')
      }
    }
  }

  private async send_reminder_message(event: scheduled_event_row, header: string) {
    const channel = await this.client.channels.fetch(event.channelId)
    const sendable = getSendableChannel(channel)
    if (!sendable) throw new Error('scheduled event channel is not sendable')

    const starts_ts = to_unix_seconds(new Date(event.startsAt))
    const embed = new EmbedBuilder()
      .setColor(COLORS.INFO)
      .setTitle(`${header}: ${event.title}`)
      .addFields({ name: '📅 Começa', value: `<t:${starts_ts}:F> (<t:${starts_ts}:R>)`, inline: false })

    if (event.description) embed.setDescription(event.description)

    await sendable.send({
      content: `${EMOJIS.INFO} **Evento:** ${event.title}`,
      embeds: [embed],
      allowedMentions: { parse: [] },
    })
  }

  private async mark_due_as_ended(now: Date) {
    try {
      await prisma.scheduledEvent.updateMany({
        where: {
          ended: false,
          cancelled: false,
          startsAt: { lt: new Date(now.getTime() - 5 * 60 * 1000) },
        },
        data: { ended: true },
      })
    } catch (error) {
      logger.error({ err: safe_error_details(error) }, 'Erro ao finalizar eventos automaticamente')
    }
  }
}
''')

          Path('apps/bot/src/services/pollExpirationScheduler.ts').write_text(r'''import { Client } from 'discord.js'
import { prisma } from '@yuebot/database'

import { logger } from '../utils/logger'
import { safe_error_details } from '../utils/safe_error'
import { pollService, poll_option } from './poll.service'

const CLAIM_LEASE_MS = 5 * 60 * 1000

export class PollExpirationScheduler {
  private interval: NodeJS.Timeout | null = null
  private running = false

  constructor(private client: Client) {}

  start() {
    if (this.interval) return
    this.interval = setInterval(() => void this.tick(), 60_000)
    void this.tick()
    logger.info('📊 Poll expiration scheduler started')
  }

  stop() {
    if (!this.interval) return
    clearInterval(this.interval)
    this.interval = null
    logger.info('📊 Poll expiration scheduler stopped')
  }

  private async tick() {
    if (this.running) return
    this.running = true
    try {
      const now = new Date()
      const stale_claim = new Date(now.getTime() - CLAIM_LEASE_MS)
      const expiredPolls = await prisma.poll.findMany({
        where: {
          endsAt: { lte: now },
          AND: [
            { OR: [{ ended: false }, { expirationNotifiedAt: null }, { expirationMessageUpdatedAt: null }] },
            { OR: [{ expirationClaimedAt: null }, { expirationClaimedAt: { lt: stale_claim } }] },
          ],
        },
        orderBy: { endsAt: 'asc' },
        take: 50,
      })

      for (const poll of expiredPolls) {
        await this.handlePollExpiration(poll, now, stale_claim)
      }
    } catch (error) {
      logger.error({ err: safe_error_details(error) }, 'Error processing poll expiration scheduler')
    } finally {
      this.running = false
    }
  }

  private async handlePollExpiration(
    poll: {
      id: string
      channelId: string
      messageId: string
      question: string
      options: unknown
      multiVote: boolean
      endsAt: Date
      createdAt: Date
      expirationNotifiedAt: Date | null
      expirationMessageUpdatedAt: Date | null
    },
    now: Date,
    stale_claim: Date,
  ) {
    const claimed = await prisma.poll.updateMany({
      where: {
        id: poll.id,
        OR: [{ expirationClaimedAt: null }, { expirationClaimedAt: { lt: stale_claim } }],
      },
      data: { ended: true, expirationClaimedAt: now },
    })
    if (claimed.count === 0) return

    try {
      if (!poll.expirationNotifiedAt) {
        await pollService.sendPollExpirationNotification(
          this.client as unknown as Parameters<typeof pollService.sendPollExpirationNotification>[0],
          {
            id: poll.id,
            channelId: poll.channelId,
            question: poll.question,
            options: poll.options as poll_option[],
          }
        )
        await prisma.poll.update({ where: { id: poll.id }, data: { expirationNotifiedAt: new Date() } })
      }

      if (!poll.expirationMessageUpdatedAt) {
        await pollService.updatePollMessage(
          {
            messageId: poll.messageId,
            channelId: poll.channelId,
            question: poll.question,
            options: poll.options as poll_option[],
            multiVote: poll.multiVote,
            endsAt: poll.endsAt,
            ended: true,
            createdAt: poll.createdAt,
          },
          this.client as unknown as Parameters<typeof pollService.updatePollMessage>[1]
        )
        await prisma.poll.update({ where: { id: poll.id }, data: { expirationMessageUpdatedAt: new Date() } })
      }

      logger.info({ pollId: poll.id, question: poll.question }, 'Poll expired and delivery completed')
    } catch (error) {
      logger.error({ err: safe_error_details(error), pollId: poll.id }, 'Failed to process poll expiration')
    } finally {
      await prisma.poll.updateMany({
        where: { id: poll.id, expirationClaimedAt: now },
        data: { expirationClaimedAt: null },
      }).catch(() => undefined)
    }
  }
}
''')

          Path('apps/bot/src/services/inventoryExpirationScheduler.ts').write_text(r'''import { Client } from 'discord.js'
import { prisma } from '@yuebot/database'

import { logger } from '../utils/logger'
import { safe_error_details } from '../utils/safe_error'

const CLAIM_LEASE_MS = 5 * 60 * 1000

type inventory_row = {
  id: string
  userId: string
  guildId: string | null
  kind: string
  metadata: unknown
  expiresAt: Date | null
}

function extract_role_id(metadata: unknown): string | null {
  if (!metadata || typeof metadata !== 'object') return null
  const role_id = (metadata as Record<string, unknown>).roleId
  return typeof role_id === 'string' && role_id.trim() ? role_id : null
}

function is_unknown_member_error(error: unknown): boolean {
  return (error as { code?: unknown } | null)?.code === 10007
}

export class InventoryExpirationScheduler {
  private interval: NodeJS.Timeout | null = null
  private running = false

  constructor(private client: Client) {}

  start() {
    if (this.interval) return
    this.interval = setInterval(() => void this.tick(), 60_000)
    void this.tick()
    logger.info('🎒 Inventory expiration scheduler started')
  }

  stop() {
    if (!this.interval) return
    clearInterval(this.interval)
    this.interval = null
    logger.info('🎒 Inventory expiration scheduler stopped')
  }

  private async tick() {
    if (this.running) return
    this.running = true
    try {
      const now = new Date()
      const stale_claim = new Date(now.getTime() - CLAIM_LEASE_MS)
      const due = await prisma.inventoryItem.findMany({
        where: {
          activatedAt: { not: null },
          expiresAt: { not: null, lte: now },
          expiredHandledAt: null,
          OR: [{ expirationClaimedAt: null }, { expirationClaimedAt: { lt: stale_claim } }],
        },
        orderBy: { expiresAt: 'asc' },
        take: 50,
        select: { id: true, userId: true, guildId: true, kind: true, metadata: true, expiresAt: true },
      })

      for (const item of due) {
        const claimed = await prisma.inventoryItem.updateMany({
          where: {
            id: item.id,
            expiredHandledAt: null,
            OR: [{ expirationClaimedAt: null }, { expirationClaimedAt: { lt: stale_claim } }],
          },
          data: { expirationClaimedAt: now },
        })
        if (claimed.count === 0) continue
        await this.handle_one(now, item)
      }
    } catch (error) {
      logger.error({ err: safe_error_details(error) }, 'Erro ao processar inventory expiration scheduler')
    } finally {
      this.running = false
    }
  }

  private async handle_one(now: Date, item: inventory_row) {
    try {
      if (item.kind === 'temp_role' || item.kind === 'nick_color') {
        const guild_id = item.guildId
        const role_id = extract_role_id(item.metadata)

        if (guild_id && role_id) {
          const guild = this.client.guilds.cache.get(guild_id) ?? await this.client.guilds.fetch(guild_id)
          let member = guild.members.cache.get(item.userId) ?? null
          if (!member) {
            try {
              member = await guild.members.fetch(item.userId)
            } catch (error) {
              if (!is_unknown_member_error(error)) throw error
            }
          }

          if (member?.roles.cache.has(role_id)) {
            await member.roles.remove(role_id)
          }

          if (item.kind === 'nick_color') {
            const role = guild.roles.cache.get(role_id) ?? await guild.roles.fetch(role_id)
            if (role && role.members.size === 0 && role.name.startsWith('Yue Color ') && role.editable) {
              await role.delete('inventory nick_color expired')
            }
          }
        }
      }

      await prisma.inventoryItem.updateMany({
        where: { id: item.id, expiredHandledAt: null },
        data: { expiredHandledAt: now, expirationClaimedAt: null },
      })
    } catch (error) {
      await prisma.inventoryItem.updateMany({
        where: { id: item.id },
        data: { expirationClaimedAt: null },
      }).catch(() => undefined)
      logger.error({ err: safe_error_details(error), inventoryItemId: item.id }, 'Falha ao processar expiração de item do inventário; será tentado novamente')
    }
  }
}
''')

