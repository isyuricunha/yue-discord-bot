name: Web performance migration

on:
  push:
    branches:
      - perf/web-runtime-optimization
    paths:
      - .github/workflows/web-perf-migration.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-24.04
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Check out branch
        uses: actions/checkout@v7
        with:
          ref: perf/web-runtime-optimization
          fetch-depth: 1

      - name: Apply web performance changes
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import json
          import re

          def read(path: str) -> str:
              return Path(path).read_text()

          def write(path: str, content: str) -> None:
              Path(path).write_text(content)

          def replace_once(path: str, old: str, new: str) -> None:
              content = read(path)
              count = content.count(old)
              if count != 1:
                  raise RuntimeError(f'{path}: expected exactly one match, found {count}: {old[:80]!r}')
              write(path, content.replace(old, new, 1))

          # Keep server-only env loading out of the browser-facing shared barrel.
          replace_once('packages/shared/src/index.ts', "export * from './env';\n", '')

          shared_package_path = Path('packages/shared/package.json')
          shared_package = json.loads(shared_package_path.read_text())
          current_exports = shared_package['exports']
          shared_package['exports'] = {
              '.': current_exports['.'],
              './env': {
                  'types': './dist/env.d.ts',
                  'import': './dist/esm/env.js',
                  'require': './dist/env.js',
                  'default': './dist/env.js',
              },
              **{key: value for key, value in current_exports.items() if key != '.'},
          }
          shared_package_path.write_text(json.dumps(shared_package, indent=2, ensure_ascii=False) + '\n')

          for config_path in ('apps/api/src/config.ts', 'apps/bot/src/config.ts'):
              replace_once(config_path, "import { load_env } from '@yuebot/shared';", "import { load_env } from '@yuebot/shared/env';")

          # Consolidate notifications on Yue's own toast system and remove Sonner.
          web_package_path = Path('apps/web/package.json')
          web_package = json.loads(web_package_path.read_text())
          removed = web_package['dependencies'].pop('sonner', None)
          if removed is None:
              raise RuntimeError('apps/web/package.json: sonner dependency not found')
          web_package_path.write_text(json.dumps(web_package, indent=2, ensure_ascii=False) + '\n')

          replace_once(
              'apps/web/src/hooks/useGuilds.ts',
              "import { toast } from 'sonner'",
              "import { toast_error } from '../store/toast'",
          )
          replace_once('apps/web/src/hooks/useGuilds.ts', 'toast.error(errorMessage)', 'toast_error(errorMessage)')

          replace_once(
              'apps/web/src/pages/guild/hooks/useGuildSummary.ts',
              "import { toast } from 'sonner'",
              "import { toast_error } from '../../../store/toast'",
          )
          replace_once('apps/web/src/pages/guild/hooks/useGuildSummary.ts', 'toast.error(errorMessage)', 'toast_error(errorMessage)')

          replace_once(
              'apps/web/src/pages/components/AuditLogItem.tsx',
              "import { toast } from 'sonner'",
              "import { toast_error, toast_success } from '../../store/toast'",
          )
          audit_path = Path('apps/web/src/pages/components/AuditLogItem.tsx')
          audit = audit_path.read_text()
          if audit.count('toast.success(') != 1 or audit.count('toast.error(') != 1:
              raise RuntimeError('AuditLogItem toast call counts changed unexpectedly')
          audit = audit.replace('toast.success(', 'toast_success(').replace('toast.error(', 'toast_error(')
          audit_path.write_text(audit)

          # Lazy-load UI that is normally closed: the Ella drawer and command palette.
          app_shell = Path('apps/web/src/components/layout/app_shell.tsx')
          shell = app_shell.read_text()
          shell = shell.replace(
              "import { Suspense, useEffect, useMemo, useRef, useState } from 'react'",
              "import { lazy, Suspense, useEffect, useMemo, useRef, useState } from 'react'",
          )
          shell = shell.replace("import { CommandPalette } from '../command_palette'\n", '')
          shell = shell.replace("import { PanelAssistantDrawer } from '../panel-ai/PanelAssistantDrawer'\n", '')
          shell = shell.replace(
              "import { getPanelAssistantGuildId, PanelAssistantProvider } from '../panel-ai/PanelAssistantProvider'\n",
              "import { getPanelAssistantGuildId, PanelAssistantProvider } from '../panel-ai/PanelAssistantProvider'\nimport { useCommandPaletteStore } from '../../store/command_palette'\n",
          )
          storage_marker = "const STORAGE_KEY = 'yuebot-sidebar-collapsed'\n"
          lazy_declarations = """const STORAGE_KEY = 'yuebot-sidebar-collapsed'\n\nconst CommandPalette = lazy(() =>\n  import('../command_palette').then(({ CommandPalette }) => ({ default: CommandPalette })),\n)\nconst PanelAssistantDrawer = lazy(() =>\n  import('../panel-ai/PanelAssistantDrawer').then(({ PanelAssistantDrawer }) => ({ default: PanelAssistantDrawer })),\n)\n"""
          if shell.count(storage_marker) != 1:
              raise RuntimeError('AppShell storage marker changed unexpectedly')
          shell = shell.replace(storage_marker, lazy_declarations, 1)
          state_marker = "  const [ellaDrawerOpen, setEllaDrawerOpen] = useState(false)\n"
          state_replacement = state_marker + "  const commandPaletteOpen = useCommandPaletteStore((state) => state.isOpen)\n"
          if shell.count(state_marker) != 1:
              raise RuntimeError('AppShell drawer state marker changed unexpectedly')
          shell = shell.replace(state_marker, state_replacement, 1)
          drawer_old = """        <PanelAssistantDrawer\n          open={visibleEllaDrawer}\n          onClose={() => setEllaDrawerOpen(false)}\n          triggerRef={ellaTriggerRef}\n        />\n\n        <ToastViewport />\n        <CommandPalette />\n"""
          drawer_new = """        {visibleEllaDrawer && (\n          <Suspense fallback={null}>\n            <PanelAssistantDrawer\n              open\n              onClose={() => setEllaDrawerOpen(false)}\n              triggerRef={ellaTriggerRef}\n            />\n          </Suspense>\n        )}\n\n        <ToastViewport />\n        {commandPaletteOpen && (\n          <Suspense fallback={null}>\n            <CommandPalette />\n          </Suspense>\n        )}\n"""
          if shell.count(drawer_old) != 1:
              raise RuntimeError('AppShell drawer/palette block changed unexpectedly')
          shell = shell.replace(drawer_old, drawer_new, 1)
          app_shell.write_text(shell)

          # Ctrl/Cmd+K must live outside the lazy command palette so it can mount on demand.
          keyboard_path = Path('apps/web/src/hooks/use_keyboard.ts')
          keyboard = keyboard_path.read_text()
          keyboard = keyboard.replace(
              "import { useNavigate, useParams, useLocation } from 'react-router-dom'\n",
              "import { useNavigate, useParams, useLocation } from 'react-router-dom'\nimport { useCommandPaletteStore } from '../store/command_palette'\n",
              1,
          )
          keyboard = keyboard.replace(
              "  const location = useLocation()\n",
              "  const location = useLocation()\n  const toggleCommandPalette = useCommandPaletteStore((state) => state.toggle)\n",
              1,
          )
          keyboard = keyboard.replace(
              "    const handleKeyDown = (e: KeyboardEvent) => {\n      // Ignore if meta/ctrl key is pressed (except for specific combos)\n      if (e.metaKey || e.ctrlKey) return\n",
              "    const handleKeyDown = (e: KeyboardEvent) => {\n      if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') {\n        e.preventDefault()\n        toggleCommandPalette()\n        return\n      }\n\n      // Ignore other meta/ctrl shortcuts.\n      if (e.metaKey || e.ctrlKey) return\n",
              1,
          )
          keyboard = keyboard.replace(
              "  }, [goBack, goToDashboard, goToGuild, location.pathname, guildId])\n",
              "  }, [goBack, goToDashboard, goToGuild, location.pathname, guildId, toggleCommandPalette])\n",
              1,
          )
          keyboard_path.write_text(keyboard)

          palette_path = Path('apps/web/src/components/command_palette.tsx')
          palette = palette_path.read_text()
          palette = palette.replace(
              '  const { isOpen, close, toggle } = useCommandPaletteStore()\n',
              '  const { isOpen, close } = useCommandPaletteStore()\n',
              1,
          )
          ctrl_k_block = """      if ((e.metaKey || e.ctrlKey) && e.key === 'k') {\n        e.preventDefault()\n        toggle()\n      }\n"""
          if palette.count(ctrl_k_block) != 1:
              raise RuntimeError('CommandPalette Ctrl+K block changed unexpectedly')
          palette = palette.replace(ctrl_k_block, '', 1)
          palette_path.write_text(palette)

          # Return the target username with recent moderation actions instead of downloading all members in Overview.
          stats_path = Path('apps/api/src/routes/stats.routes.ts')
          stats = stats_path.read_text()
          stats = stats.replace(
              "            createdAt: true,\n          },\n        }),",
              "            createdAt: true,\n            member: { select: { username: true } },\n          },\n        }),",
              1,
          )
          total_members_block = """      const totalMembers = typeof guildCounts?.approximateMemberCount === 'number'\n        ? guildCounts.approximateMemberCount\n        : 0\n\n      return reply.send({\n"""
          total_members_replacement = """      const totalMembers = typeof guildCounts?.approximateMemberCount === 'number'\n        ? guildCounts.approximateMemberCount\n        : 0\n      const recentActionsWithUsers = recentActions.map(({ member, ...action }) => ({\n        ...action,\n        userName: member.username,\n      }))\n\n      return reply.send({\n"""
          if stats.count(total_members_block) != 1:
              raise RuntimeError('stats.routes totalMembers block changed unexpectedly')
          stats = stats.replace(total_members_block, total_members_replacement, 1)
          response_marker = "        recentActions,\n        actionsByType,"
          if stats.count(response_marker) != 1:
              raise RuntimeError('stats.routes recentActions response marker changed unexpectedly')
          stats = stats.replace(response_marker, "        recentActions: recentActionsWithUsers,\n        actionsByType,", 1)
          stats_path.write_text(stats)

          # Split Recharts from the Overview route and remove the all-members request.
          overview_path = Path('apps/web/src/pages/Overview.tsx')
          overview = overview_path.read_text()
          overview = overview.replace("import { useMemo } from 'react'", "import { lazy, Suspense } from 'react'", 1)
          overview = overview.replace("import { AreaChart, Area, XAxis, YAxis, CartesianGrid, Tooltip, ResponsiveContainer } from 'recharts'\n", '', 1)
          overview = overview.replace(
              "const API_URL = getApiUrl()\n",
              "const API_URL = getApiUrl()\nconst OverviewCharts = lazy(() => import('./components/OverviewCharts'))\n",
              1,
          )
          overview = overview.replace(
              "    createdAt: string\n  }[]",
              "    createdAt: string\n    userName: string | null\n  }[]",
              1,
          )
          members_block = """  const {\n    data: members_data,\n  } = useQuery({\n    queryKey: ['members', guildId],\n    queryFn: async () => {\n      const response = await axios.get(`${API_URL}/api/guilds/${guildId}/members`)\n      return (response.data as { success: boolean; members: { userId: string; username: string; avatar: string | null }[] }).members\n    },\n  })\n\n  const member_by_id = useMemo(() => {\n    const map = new Map<string, string>()\n    for (const m of members_data ?? []) {\n      map.set(m.userId, m.username)\n    }\n    return map\n  }, [members_data])\n\n  function resolve_user(userId: string): string {\n    const name = member_by_id.get(userId)\n    return name ? `@${name}` : `#${userId.slice(-5)}`\n  }\n\n"""
          members_replacement = """  function resolve_user(userId: string, userName: string | null): string {\n    return userName ? `@${userName}` : `#${userId.slice(-5)}`\n  }\n\n"""
          if overview.count(members_block) != 1:
              raise RuntimeError('Overview members lookup block changed unexpectedly')
          overview = overview.replace(members_block, members_replacement, 1)

          chart_pattern = re.compile(
              r"      \{/\* Estatísticas Cronológicas \*/\}\n      \{!is_loading && stats\?\.chartData && stats\.chartData\.length > 0 && \(\n.*?\n      \)\}\n\n      \{Boolean\(stats\?\.actionsByType",
              re.S,
          )
          chart_replacement = """      {/* Estatísticas Cronológicas */}\n      {!is_loading && stats?.chartData && stats.chartData.length > 0 && (\n        <Suspense\n          fallback={\n            <div className=\"grid grid-cols-1 gap-4 lg:grid-cols-2\">\n              {[0, 1].map((index) => (\n                <Card key={index}>\n                  <CardContent className=\"p-6\">\n                    <Skeleton className=\"mb-4 h-4 w-48\" />\n                    <Skeleton className=\"h-64 w-full\" />\n                  </CardContent>\n                </Card>\n              ))}\n            </div>\n          }\n        >\n          <OverviewCharts data={stats.chartData} />\n        </Suspense>\n      )}\n\n      {Boolean(stats?.actionsByType"""
          overview, count = chart_pattern.subn(chart_replacement, overview, count=1)
          if count != 1:
              raise RuntimeError(f'Overview chart block replacement count was {count}')
          if overview.count('{resolve_user(action.userId)}') != 1:
              raise RuntimeError('Overview recent user rendering changed unexpectedly')
          overview = overview.replace('{resolve_user(action.userId)}', '{resolve_user(action.userId, action.userName)}', 1)
          overview_path.write_text(overview)

          charts_path = Path('apps/web/src/pages/components/OverviewCharts.tsx')
          charts_path.write_text("""import { Area, AreaChart, CartesianGrid, ResponsiveContainer, Tooltip, XAxis, YAxis } from 'recharts'\n\nimport { Card, CardContent } from '../../components/ui'\n\ntype chart_point = {\n  date: string\n  newMembers: number\n  moderationActions: number\n  economy: number\n}\n\ntype props = {\n  data: chart_point[]\n}\n\nexport default function OverviewCharts({ data }: props) {\n  return (\n    <div className=\"grid grid-cols-1 gap-4 lg:grid-cols-2\">\n      <Card>\n        <CardContent className=\"p-6\">\n          <div className=\"mb-4 text-sm font-medium\">Ingresso de Membros (7 dias)</div>\n          <div className=\"h-64 w-full\">\n            <ResponsiveContainer width=\"100%\" height={256}>\n              <AreaChart data={data} margin={{ top: 10, right: 10, left: -20, bottom: 0 }}>\n                <defs>\n                  <linearGradient id=\"colorMembers\" x1=\"0\" y1=\"0\" x2=\"0\" y2=\"1\">\n                    <stop offset=\"5%\" stopColor=\"var(--cursor-accent-navy)\" stopOpacity={0.3} />\n                    <stop offset=\"95%\" stopColor=\"var(--cursor-accent-navy)\" stopOpacity={0} />\n                  </linearGradient>\n                </defs>\n                <CartesianGrid strokeDasharray=\"3 3\" stroke=\"var(--yu-border-default)\" vertical={false} />\n                <XAxis dataKey=\"date\" stroke=\"var(--cursor-text-muted)\" fontSize={12} tickLine={false} axisLine={false} />\n                <YAxis stroke=\"var(--cursor-text-muted)\" fontSize={12} tickLine={false} axisLine={false} tickFormatter={(value) => `${value}`} />\n                <Tooltip\n                  contentStyle={{ backgroundColor: 'var(--cursor-bg-popover)', borderColor: 'var(--yu-border-default)', borderRadius: 'var(--yu-radius-popover)', boxShadow: 'var(--cursor-floating-shadow)' }}\n                  itemStyle={{ color: 'var(--cursor-text-primary)' }}\n                />\n                <Area type=\"monotone\" dataKey=\"newMembers\" name=\"Novos Membros\" stroke=\"var(--cursor-accent-navy)\" fillOpacity={1} fill=\"url(#colorMembers)\" />\n              </AreaChart>\n            </ResponsiveContainer>\n          </div>\n        </CardContent>\n      </Card>\n\n      <Card>\n        <CardContent className=\"p-6\">\n          <div className=\"mb-4 text-sm font-medium\">Economia & Moderação (7 dias)</div>\n          <div className=\"h-64 w-full\">\n            <ResponsiveContainer width=\"100%\" height={256}>\n              <AreaChart data={data} margin={{ top: 10, right: 10, left: -20, bottom: 0 }}>\n                <defs>\n                  <linearGradient id=\"colorEcon\" x1=\"0\" y1=\"0\" x2=\"0\" y2=\"1\">\n                    <stop offset=\"5%\" stopColor=\"var(--cursor-accent-yellow)\" stopOpacity={0.3} />\n                    <stop offset=\"95%\" stopColor=\"var(--cursor-accent-yellow)\" stopOpacity={0} />\n                  </linearGradient>\n                  <linearGradient id=\"colorMod\" x1=\"0\" y1=\"0\" x2=\"0\" y2=\"1\">\n                    <stop offset=\"5%\" stopColor=\"var(--cursor-accent-red)\" stopOpacity={0.3} />\n                    <stop offset=\"95%\" stopColor=\"var(--cursor-accent-red)\" stopOpacity={0} />\n                  </linearGradient>\n                </defs>\n                <CartesianGrid strokeDasharray=\"3 3\" stroke=\"var(--yu-border-default)\" vertical={false} />\n                <XAxis dataKey=\"date\" stroke=\"var(--cursor-text-muted)\" fontSize={12} tickLine={false} axisLine={false} />\n                <YAxis stroke=\"var(--cursor-text-muted)\" fontSize={12} tickLine={false} axisLine={false} tickFormatter={(value) => `${value}`} />\n                <Tooltip\n                  contentStyle={{ backgroundColor: 'var(--cursor-bg-popover)', borderColor: 'var(--yu-border-default)', borderRadius: 'var(--yu-radius-popover)', boxShadow: 'var(--cursor-floating-shadow)' }}\n                  itemStyle={{ color: 'var(--cursor-text-primary)' }}\n                />\n                <Area type=\"monotone\" dataKey=\"economy\" name=\"Transações Globais\" stroke=\"var(--cursor-accent-yellow)\" fillOpacity={1} fill=\"url(#colorEcon)\" />\n                <Area type=\"monotone\" dataKey=\"moderationActions\" name=\"Ações de Mod.\" stroke=\"var(--cursor-accent-red)\" fillOpacity={1} fill=\"url(#colorMod)\" />\n              </AreaChart>\n            </ResponsiveContainer>\n          </div>\n        </CardContent>\n      </Card>\n    </div>\n  )\n}\n""")

          # Point normal UI at smaller assets; keep /icon.png as the 512px PWA/README image.
          for ui_path in (
              'apps/web/src/components/layout/sidebar.tsx',
              'apps/web/src/components/layout/public_shell.tsx',
              'apps/web/src/pages/Login.tsx',
          ):
              content = read(ui_path)
              if 'src="/icon.png"' not in content:
                  raise RuntimeError(f'{ui_path}: expected icon source not found')
              write(ui_path, content.replace('src="/icon.png"', 'src="/icon-192.png"'))

          index_path = Path('apps/web/index.html')
          index_html = index_path.read_text()
          index_html = index_html.replace('<link rel="icon" type="image/png" href="/icon.png" />', '<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />', 1)
          index_html = index_html.replace('<link rel="apple-touch-icon" href="/icon.png" />', '<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />', 1)
          index_html = index_html.replace('content="https://yuebot.yuricunha.com/icon.png"', 'content="https://yuebot.yuricunha.com/og-image.png"')
          index_path.write_text(index_html)

          manifest_path = Path('apps/web/public/manifest.webmanifest')
          manifest = json.loads(manifest_path.read_text())
          manifest['icons'] = [
              {'src': '/icon-192.png', 'sizes': '192x192', 'type': 'image/png'},
              {'src': '/icon.png', 'sizes': '512x512', 'type': 'image/png'},
          ]
          manifest_path.write_text(json.dumps(manifest, indent=2, ensure_ascii=False) + '\n')
          PY

      - name: Optimize Yue image assets
        shell: bash
        run: |
          set -euo pipefail
          if command -v magick >/dev/null 2>&1; then
            IMAGE_TOOL=magick
          elif command -v convert >/dev/null 2>&1; then
            IMAGE_TOOL=convert
          else
            sudo apt-get update
            sudo apt-get install -y imagemagick
            IMAGE_TOOL=convert
          fi

          cp apps/web/public/icon.png /tmp/yue-source.png
          "$IMAGE_TOOL" /tmp/yue-source.png -auto-orient -strip -resize '1200x1200>' -define png:compression-level=9 apps/web/public/og-image.png
          "$IMAGE_TOOL" /tmp/yue-source.png -auto-orient -strip -resize '512x512>' -define png:compression-level=9 apps/web/public/icon.png
          "$IMAGE_TOOL" /tmp/yue-source.png -auto-orient -strip -resize '192x192>' -define png:compression-level=9 apps/web/public/icon-192.png
          "$IMAGE_TOOL" /tmp/yue-source.png -auto-orient -strip -resize '180x180>' -define png:compression-level=9 apps/web/public/apple-touch-icon.png
          "$IMAGE_TOOL" /tmp/yue-source.png -auto-orient -strip -resize '32x32>' -define png:compression-level=9 apps/web/public/favicon-32.png

          echo 'Optimized asset sizes:'
          ls -lh apps/web/public/icon.png apps/web/public/icon-192.png apps/web/public/apple-touch-icon.png apps/web/public/favicon-32.png apps/web/public/og-image.png

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Refresh lockfile
        run: pnpm install --lockfile-only

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate lint
        run: pnpm lint

      - name: Validate type-check
        run: pnpm type-check

      - name: Validate tests
        run: pnpm test

      - name: Build and capture bundle sizes
        shell: bash
        run: |
          set -o pipefail
          pnpm build 2>&1 | tee /tmp/web-perf-build.log
          echo '--- Web bundle summary ---'
          grep 'apps/web build: dist/' /tmp/web-perf-build.log || true

      - name: Commit validated optimization
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/web-perf-migration.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --stat
          git commit -m 'perf(web): reduce initial payload and overview cost'
          git push origin HEAD:perf/web-runtime-optimization
