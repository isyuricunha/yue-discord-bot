name: Core reliability migration

on:
  push:
    branches:
      - fix/core-runtime-reliability

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-24.04
    if: ${{ github.actor != 'github-actions[bot]' }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply migration payload
        run: |
          python - <<'PY'
          from pathlib import Path
          source = Path('.github/workflows/core-reliability-stage1.yml').read_text()
          start_marker = "          python <<'PY'\n"
          end_marker = "\n          PY\n\n          pnpm exec prisma format"
          start = source.index(start_marker) + len(start_marker)
          end = source.index(end_marker, start)
          lines = source[start:end].splitlines()
          payload = '\n'.join(line[10:] if line.startswith('          ') else line for line in lines)
          exec(compile(payload, 'core-reliability-stage1.py', 'exec'))

          migration = Path('packages/database/prisma/migrations/20260825050000_harden_scheduled_jobs/migration.sql')
          sql = migration.read_text()
          unique = 'CREATE UNIQUE INDEX "giveaway_winners_giveaway_user_key" ON "giveaway_winners"("giveawayId", "userId");'
          dedupe = '''WITH ranked AS (\n  SELECT "id", ROW_NUMBER() OVER (\n    PARTITION BY "giveawayId", "userId"\n    ORDER BY "createdAt" ASC, "id" ASC\n  ) AS rn\n  FROM "giveaway_winners"\n)\nDELETE FROM "giveaway_winners"\nWHERE "id" IN (SELECT "id" FROM ranked WHERE rn > 1);\n\n'''
          if unique not in sql:
              raise SystemExit('giveaway winner unique index statement missing')
          migration.write_text(sql.replace(unique, dedupe + unique, 1))
          PY
          pnpm --dir packages/database exec prisma format --schema prisma/schema.prisma
          pnpm db:generate
          rm .github/workflows/core-reliability-stage1.yml
          rm .github/workflows/core-reliability-driver.yml
      - name: Validate
        run: |
          pnpm lint
          pnpm type-check
          pnpm test
          pnpm build
          pnpm knip
      - name: Commit validated changes
        run: |
          git config user.name 'Ella Mizuki'
          git config user.email 'ella@yuricunha.com'
          git add -A
          git commit -m 'fix(core): harden scheduled background jobs'
          git push origin HEAD:fix/core-runtime-reliability
